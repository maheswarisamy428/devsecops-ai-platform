# Gitleaks configuration for detecting hardcoded secrets
# Generic pattern-based detection to identify potential secrets
# without relying on provider-specific variable names.

title = "Generic Secret Detection Configuration"

# Generic API keys, access tokens, secrets, passwords and private keys
[[rules]]
description = "Generic Hardcoded Secret"
regex = '''(?i)(api[_-]?key|access[_-]?key|secret[_-]?key|client[_-]?secret|access[_-]?token|auth[_-]?token|password|passwd|private[_-]?key|secret|token)\s*[:=]\s*["']?[A-Za-z0-9_./+=:@#$%^&*~?{}\[\]-]{12,}["']?'''
keywords = [
    "api_key",
    "apikey",
    "access_key",
    "access_token",
    "auth_token",
    "client_secret",
    "password",
    "passwd",
    "private_key",
    "secret",
    "token"
]

# Generic bearer tokens
[[rules]]
description = "Bearer Token"
regex = '''(?i)Bearer\s+[A-Za-z0-9._~+/=-]{20,}'''
keywords = ["Bearer"]

# Generic Basic authentication credentials
[[rules]]
description = "Basic Authentication Credential"
regex = '''(?i)Basic\s+[A-Za-z0-9+/=]{20,}'''
keywords = ["Basic"]

# Generic JSON Web Tokens
[[rules]]
description = "JSON Web Token"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
keywords = ["eyJ"]

# Generic private key material
[[rules]]
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]

# Generic connection strings containing credentials
[[rules]]
description = "Connection String With Credentials"
regex = '''(?i)(Server|Host|Data Source|Endpoint|AccountName)\s*=\s*[^;\s]+.*(Password|Pwd|AccountKey|AccessKey|Secret)\s*=\s*[^;\s]+'''
keywords = [
    "Server=",
    "Host=",
    "Data Source=",
    "Password=",
    "Pwd=",
    "AccountKey=",
    "AccessKey=",
    "Secret="
]

# Generic high-entropy secret-like value assigned to a variable
[[rules]]
description = "Potential High Entropy Secret"
regex = '''(?i)(key|secret|token|credential|password|passwd)\s*[:=]\s*["'][A-Za-z0-9+/=_\-]{20,}["']'''
keywords = [
    "key",
    "secret",
    "token",
    "credential",
    "password",
    "passwd"
]