rules:
  - id: docker-no-latest-tag
    message: "Do not use the mutable :latest tag for container base images. Pin a stable version or digest."
    severity: ERROR
    languages:
      - dockerfile
    pattern: FROM $IMAGE:latest

  - id: docker-unpinned-base-image
    message: "Container base image must be pinned to an explicit version or digest."
    severity: ERROR
    languages:
      - dockerfile
    patterns:
      - pattern: FROM $IMAGE
      - pattern-not: FROM $IMAGE:$TAG
      - pattern-not: FROM $IMAGE@$DIGEST