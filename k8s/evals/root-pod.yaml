apiVersion: v1
kind: Pod
metadata:
  name: root-pod-test
  namespace: ai-platform

spec:
  containers:
    - name: test
      image: nginx:1.27

      securityContext:
        runAsUser: 0
        runAsNonRoot: false

      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"