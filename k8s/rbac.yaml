apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: embedding-service-reader
  namespace: ai-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["embedding-config"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: embedding-service-reader
  namespace: ai-platform
subjects:
  - kind: ServiceAccount
    name: embedding-service
    namespace: ai-platform
roleRef:
  kind: Role
  name: embedding-service-reader
  apiGroup: rbac.authorization.k8s.io