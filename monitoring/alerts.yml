groups:
  - name: ai-platform-alerts
    rules:

      - alert: PipelineSuccessRateLow
        expr: |
          (
            sum(rate(ci_pipeline_runs_total{status="success"}[15m]))
            /
            sum(rate(ci_pipeline_runs_total[15m]))
          ) < 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CI/CD pipeline success rate is below 90%"
          description: "Pipeline success rate has remained below 90% for 10 minutes."

      - alert: PodRestartSpike
        expr: |
          increase(kube_pod_container_status_restarts_total[15m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod restart spike detected"
          description: "A container restarted at least 3 times within 15 minutes."

      - alert: PodRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total[10m]) >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Possible pod restart loop"
          description: "A container restarted at least 5 times within 10 minutes."

      - alert: SecurityPolicyDenialSpike
        expr: |
          sum(rate(kyverno_policy_rule_results_total{
            rule_result="fail"
          }[10m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Security policy denial rate increased"
          description: "Kyverno policy denials exceeded the expected baseline."

      - alert: CriticalSecurityPolicyDenialSpike
        expr: |
          sum(rate(kyverno_policy_rule_results_total{
            rule_result="fail"
          }[5m])) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical spike in security policy denials"
          description: "A sustained spike in Kyverno policy denials was detected."
          
          