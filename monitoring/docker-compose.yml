services:
  mock-exporter:
    image: python:3.13-slim
    container_name: devsecops-mock-exporter
    working_dir: /app
    volumes:
      - ./mock_exporter.py:/app/mock_exporter.py:ro
      - ./mock-metrics.txt:/app/mock-metrics.txt:ro

    command:
      - python
      - /app/mock_exporter.py
    ports:
      - "9100:9100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: devsecops-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - mock-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: devsecops-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/devsecops-ai.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  grafana-data:
  