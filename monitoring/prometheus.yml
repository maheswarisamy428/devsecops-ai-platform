global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Local simulated AI platform metrics.
  - job_name: "ai-platform"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "mock-exporter:9100"
        labels:
          environment: "local"
          platform: "devsecops-ai"
