name: DevSecOps CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python_quality:
    name: Python Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r dev_requirements.txt
          pip install -r test_requirements.txt

      - name: Run pytest
        run: |
          pytest -q

      - name: Run pylint
        run: |
          pylint app tests

      - name: Run flake8
        run: |
          flake8 app tests

      - name: Run mypy
        run: |
          mypy app tests


  sast:
    name: SAST - Semgrep
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python


  dependency_scan:
    name: SCA - pip-audit
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt


  secret_scan:
    name: Secret Scan - Gitleaks
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only needed for organizations with a paid Gitleaks license


  dockerfile_policy:
    name: Dockerfile Security Policy
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Dockerfile policy
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/docker-security.yml


  build:
    name: Build Container
    needs:
      - sast
      - dependency_scan
      - secret_scan
      - dockerfile_policy

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-ai-service:${{ github.sha }} .


  container_scan:
    name: Container Scan - Trivy
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-ai-service:${{ github.sha }} .
    
      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-ai-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH