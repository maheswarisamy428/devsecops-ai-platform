name: DevSecOps CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python_quality:
    name: Python Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r dev_requirements.txt
          pip install -r test_requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/sre-agent
        run: |
          pytest -q

      - name: Run pylint
        run: |
          pylint app tests

      - name: Run flake8
        run: |
          flake8 app tests

      - name: Run mypy
        run: |
          mypy app tests


  sast:
    name: SAST - Semgrep
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python


  dependency_scan:
    name: SCA - pip-audit
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt


  secret_scan:
    name: Secret Scan - Gitleaks
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only needed for organizations with a paid Gitleaks license


  dockerfile_policy:
    name: Dockerfile Security Policy
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Dockerfile policy
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/docker-security.yml


  build:
    name: Build Container
    needs:
      - terraform_security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-ai-service:${{ github.sha }} .


  container_scan:
    name: Container Scan - Trivy
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-ai-service:${{ github.sha }} .
    
      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-ai-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  terraform_security:
    name: Terraform IaC Security
    runs-on: ubuntu-latest
    needs:
      - sast
      - dependency_scan
      - secret_scan
      - dockerfile_policy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: |
          terraform -chdir=iac fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform -chdir=iac init -backend=false

      - name: Terraform Validate
        run: |
          terraform -chdir=iac validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Initialize TFLint
        run: |
          tflint --chdir=iac --init

      - name: Run TFLint
        run: |
          tflint --chdir=iac

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: iac
          framework: terraform
          config_file: iac/checkov.yaml

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: iac

  kubernetes_security:
    name: Kubernetes Security
    needs:
      - python_quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        uses: instrumenta/kubeval-action@master
        with:
          files: k8s

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.1.1

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          version: v1.10.3

      - name: Check Kyverno installation
        run: |
          kyverno version
          cosign version

      - name: Validate Kyverno policies
        run: |
          kyverno apply k8s/kyverno-policies.yaml \
            --resource k8s/embedding-deployment.yaml

      - name: Evaluate root pod scenario
        run: |
          set +e

          kyverno apply k8s/kyverno-policies.yaml \
            --resource k8s/evals/root-pod.yaml

          EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::Security test failed - root pod was allowed."
            exit 1
          fi

          echo "Expected security violation detected."
          echo "Root pod was correctly blocked by Kyverno."
          exit 0

      - name: Evaluate missing resource limits scenario
        run: |
          set +e

          kyverno apply k8s/kyverno-policies.yaml \
            --resource k8s/evals/no-resource-limits.yaml

          EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::Security test failed - workload without resource limits was allowed."
            exit 1
          fi

          echo "Expected security violation detected."
          echo "Missing resource limits were correctly blocked by Kyverno."
          exit 0

      - name: Evaluate unauthorized network scenario
        run: |
          set +e

          kyverno apply k8s/kyverno-policies.yaml \
            --resource k8s/evals/unauthorized-network-access.yaml

          EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::Security test failed - unauthorized network configuration was allowed."
            exit 1
          fi

          echo "Expected security violation detected."
          echo "Unauthorized network configuration was correctly blocked by Kyverno."
          exit 0